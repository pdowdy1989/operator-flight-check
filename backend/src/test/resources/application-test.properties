# Test profile — overrides main application.properties for JUnit runs.
# Flyway migrations are MySQL-specific; tests run against H2, which cannot
# parse MySQL dialect (e.g. DEFAULT b'1'). For tests we disable Flyway and
# let JPA/Hibernate create the schema from the entity classes directly.
# Flyway still runs in dev and production where the DB is MySQL.

spring.flyway.enabled=false

spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=false

spring.sql.init.mode=never

# JWT secret for tests — not sensitive, test scope only
jwt.secret=test-secret-key-at-least-32-bytes-long-for-hs256-algorithm
