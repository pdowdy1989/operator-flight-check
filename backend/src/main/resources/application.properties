spring.application.name=operator-flight-check

server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/operator_flight_check}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=never

jwt.secret=${JWT_SECRET:change-me-to-a-secure-256-bit-secret}
app.security.allowed-origins=${APP_SECURITY_ALLOWED_ORIGINS:http://localhost:5173}
app.security.auth-rate-limit.max-requests=${APP_SECURITY_AUTH_RATE_LIMIT_MAX_REQUESTS:10}
app.security.auth-rate-limit.window-seconds=${APP_SECURITY_AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
openweather.api.key=${OPENWEATHER_API_KEY:}
