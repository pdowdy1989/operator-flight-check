spring.application.name=operator-flight-check
spring.config.import=optional:file:./local.properties

server.port=8081

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/operator_flight_check}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

jwt.secret=${JWT_SECRET}
app.security.allowed-origins=${APP_SECURITY_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.security.auth-rate-limit.max-requests=${APP_SECURITY_AUTH_RATE_LIMIT_MAX_REQUESTS:10}
app.security.auth-rate-limit.window-seconds=${APP_SECURITY_AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
openweather.api.key=${OPENWEATHER_API_KEY:}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB
app.upload.dir=./uploads
